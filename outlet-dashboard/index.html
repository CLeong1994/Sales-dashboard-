<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlet performance</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Outlet performance</h1>
      <div class="sub" id="period">Loading…</div>
    </div>
    <div class="filter" id="filter" role="group" aria-label="Filter by outlet"></div>
  </header>

  <section class="kpis">
    <div class="card kpi"><div class="label">Total sales</div><div class="value" id="kpi-sales">–</div><div class="note" id="kpi-sales-note"></div></div>
    <div class="card kpi accent"><div class="label">% of target</div><div class="value" id="kpi-target">–</div><div class="note" id="kpi-target-note"></div></div>
    <div class="card kpi"><div class="label">Orders</div><div class="value" id="kpi-orders">–</div><div class="note" id="kpi-orders-note"></div></div>
    <div class="card kpi"><div class="label">Returns %</div><div class="value" id="kpi-returns">–</div><div class="note" id="kpi-returns-note"></div></div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>Sales vs target by week</h2>
      <div class="hint">Each bar is one outlet-week. Solid line marks 100% of target, dashed line marks 90%.</div>
      <div class="bars" id="bars"></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--bar)"></i>90% or more</span>
        <span><i class="sw" style="background:var(--bad)"></i>Below 90%</span>
      </div>
    </div>
    <div class="card">
      <h2>Needs attention <span class="count" id="attn-count">0</span></h2>
      <div class="hint">Outlet-weeks under 90% of target.</div>
      <ul class="attn" id="attn"></ul>
    </div>
  </section>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
